<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="freshBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43A047"/>
      <stop offset="50%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="60%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="pepperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="60%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="greensGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" rx="16" fill="url(#freshBg)"/>

  <!-- Soft Aura Glow -->
  <circle cx="200" cy="160" r="130" fill="#A5D6A7" opacity="0.25"/>

  <!-- Bell Pepper (Right) -->
  <path d="M 230 150 C 215 140 215 170 215 220 C 215 240 230 250 250 250 C 270 250 285 240 285 220 C 285 170 285 140 270 150 C 260 142 240 142 230 150 Z" fill="url(#pepperGrad)"/>
  <!-- Pepper Stem -->
  <path d="M 250 145 C 248 130 255 120 262 118" stroke="#1B5E20" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Pepper Lobes Highlight -->
  <ellipse cx="235" cy="180" rx="10" ry="25" fill="#FFFFFF" opacity="0.2"/>

  <!-- Crisp Orange Carrot (Left - Angled) -->
  <g transform="rotate(-30 150 180)">
    <!-- Carrot Greens -->
    <path d="M 150 110 C 135 70 120 75 145 95" stroke="#A5D6A7" stroke-width="4" fill="none"/>
    <path d="M 150 110 C 150 65 155 65 152 95" stroke="#C8E6C9" stroke-width="4" fill="none"/>
    <path d="M 150 110 C 165 70 180 75 155 95" stroke="#A5D6A7" stroke-width="4" fill="none"/>

    <!-- Carrot Root Body -->
    <path d="M 135 115 C 135 110 165 110 165 115 C 163 155 153 230 150 245 C 147 230 137 155 135 115 Z" fill="url(#carrotGrad)"/>
    <!-- Carrot Ridges -->
    <line x1="140" y1="135" x2="148" y2="135" stroke="#BF360C" stroke-width="2" opacity="0.5"/>
    <line x1="152" y1="155" x2="160" y2="155" stroke="#BF360C" stroke-width="2" opacity="0.5"/>
    <line x1="143" y1="180" x2="153" y2="180" stroke="#BF360C" stroke-width="2" opacity="0.5"/>
    <!-- Carrot Highlight -->
    <path d="M 142 125 C 140 150 145 190 146 200" stroke="#FFE0B2" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  </g>
</svg>