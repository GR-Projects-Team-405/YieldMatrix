<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="fruitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="50%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </linearGradient>
    <linearGradient id="mangoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="40%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="80%" stop-color="#FBC02D"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <linearGradient id="fruitLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" rx="16" fill="url(#fruitBg)"/>

  <!-- Warm Sun Glow -->
  <circle cx="200" cy="160" r="130" fill="#FFE082" opacity="0.3"/>

  <!-- Fresh Mango -->
  <path d="M 230 140 C 280 150 290 220 230 250 C 180 270 160 210 180 170 C 190 150 210 135 230 140 Z" fill="url(#mangoGrad)"/>
  <!-- Mango Highlight -->
  <path d="M 210 165 C 235 155 255 175 245 195 C 235 185 220 180 210 165 Z" fill="#FFFFFF" opacity="0.25"/>

  <!-- Sweet Banana Cluster -->
  <!-- Banana 1 -->
  <path d="M 120 220 C 120 160 170 120 240 110 C 235 118 185 135 155 185 C 140 210 130 230 120 220 Z" fill="url(#bananaGrad)"/>
  <!-- Banana 2 -->
  <path d="M 105 235 C 110 170 155 135 230 125 C 220 135 170 150 140 200 C 125 225 115 245 105 235 Z" fill="url(#bananaGrad)"/>
  <!-- Banana Tip / Crown -->
  <circle cx="238" cy="112" r="5" fill="#5D4037"/>
  <circle cx="228" cy="127" r="5" fill="#5D4037"/>
  <path d="M 105 235 C 102 242 108 248 116 242 Z" fill="#5D4037"/>

  <!-- Foliage / Leaves -->
  <path d="M 228 138 C 240 100 280 110 270 130 C 255 135 240 138 228 138 Z" fill="url(#fruitLeaf)"/>
  <path d="M 226 136 C 215 105 180 105 195 125 C 210 130 220 135 226 136 Z" fill="url(#fruitLeaf)"/>
</svg>