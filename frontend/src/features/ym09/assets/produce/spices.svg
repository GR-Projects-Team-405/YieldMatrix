<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="spiceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="50%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <linearGradient id="cinnamonRoll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="30%" stop-color="#A1887F"/>
      <stop offset="70%" stop-color="#6D4C41"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
    <radialGradient id="peppercorn" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#757575"/>
      <stop offset="50%" stop-color="#424242"/>
      <stop offset="100%" stop-color="#212121"/>
    </radialGradient>
    <linearGradient id="cinnamonStick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="25%" stop-color="#8D6E63"/>
      <stop offset="75%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" rx="16" fill="url(#spiceBg)"/>

  <!-- Warm Amber Glow -->
  <circle cx="200" cy="160" r="130" fill="#D7CCC8" opacity="0.15"/>

  <!-- Ceylon Cinnamon Quill 1 (Diagonal Left) -->
  <g transform="rotate(-35 170 170)">
    <!-- Stick Body -->
    <rect x="145" y="80" width="30" height="180" rx="6" fill="url(#cinnamonStick)"/>
    <!-- Top Cut/Spiral Roll -->
    <ellipse cx="160" cy="80" rx="15" ry="8" fill="url(#cinnamonRoll)"/>
    <ellipse cx="160" cy="80" rx="8" ry="4" fill="#3E2723"/>
    <!-- Bark Texture Lines -->
    <line x1="152" y1="95" x2="152" y2="245" stroke="#3E2723" stroke-width="1.5" opacity="0.4"/>
    <line x1="162" y1="110" x2="162" y2="230" stroke="#D7CCC8" stroke-width="1.5" opacity="0.3"/>
    <line x1="168" y1="90" x2="168" y2="250" stroke="#3E2723" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Ceylon Cinnamon Quill 2 (Diagonal Cross Right) -->
  <g transform="rotate(25 220 180)">
    <!-- Stick Body -->
    <rect x="205" y="90" width="28" height="170" rx="6" fill="url(#cinnamonStick)"/>
    <!-- Top Cut/Spiral Roll -->
    <ellipse cx="219" cy="90" rx="14" ry="7" fill="url(#cinnamonRoll)"/>
    <ellipse cx="219" cy="90" rx="7" ry="3.5" fill="#3E2723"/>
    <!-- Bark Texture Lines -->
    <line x1="212" y1="105" x2="212" y2="240" stroke="#3E2723" stroke-width="1.5" opacity="0.4"/>
    <line x1="222" y1="115" x2="222" y2="225" stroke="#D7CCC8" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Whole Black Peppercorns Cluster -->
  <circle cx="130" cy="230" r="12" fill="url(#peppercorn)"/>
  <circle cx="148" cy="242" r="10" fill="url(#peppercorn)"/>
  <circle cx="162" cy="232" r="13" fill="url(#peppercorn)"/>
  <circle cx="240" cy="235" r="11" fill="url(#peppercorn)"/>
  <circle cx="258" cy="245" r="13" fill="url(#peppercorn)"/>
  <circle cx="275" cy="230" r="10" fill="url(#peppercorn)"/>
  <circle cx="205" cy="255" r="12" fill="url(#peppercorn)"/>
</svg>