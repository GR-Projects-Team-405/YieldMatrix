<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="vegBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6565"/>
      <stop offset="50%" stop-color="#E22E2E"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="tomatoMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="60%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#9A0007"/>
    </linearGradient>
    <linearGradient id="tomatoSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7676"/>
      <stop offset="70%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#800D0D"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" rx="16" fill="url(#vegBg)"/>

  <!-- Subtle background glow -->
  <circle cx="200" cy="180" r="140" fill="#FF8A80" opacity="0.18"/>

  <!-- Left Supporting Tomato -->
  <ellipse cx="140" cy="185" rx="55" ry="50" fill="url(#tomatoSide)"/>
  <ellipse cx="130" cy="170" rx="18" ry="12" fill="#FFFFFF" opacity="0.15" transform="rotate(-15 130 170)"/>

  <!-- Right Supporting Tomato -->
  <ellipse cx="260" cy="185" rx="55" ry="50" fill="url(#tomatoSide)"/>
  <ellipse cx="270" cy="170" rx="18" ry="12" fill="#FFFFFF" opacity="0.15" transform="rotate(15 270 170)"/>

  <!-- Center Main Ripe Tomato -->
  <ellipse cx="200" cy="195" rx="68" ry="60" fill="url(#tomatoMain)"/>
  <!-- Tomato Highlight -->
  <ellipse cx="175" cy="170" rx="24" ry="14" fill="#FFFFFF" opacity="0.25" transform="rotate(-20 175 170)"/>

  <!-- Tomato Calyx and Stem -->
  <!-- Stem -->
  <path d="M 200 138 Q 202 120 196 110 Q 192 108 195 106 Q 204 116 206 138 Z" fill="#2E7D32"/>

  <!-- Star-shaped Sepals / Leaves -->
  <!-- Center Sepal -->
  <path d="M 200 142 Q 200 128 200 120 Q 204 128 203 142 Z" fill="url(#leafGrad)"/>
  <!-- Left Sepal 1 -->
  <path d="M 197 141 Q 175 130 162 135 Q 178 142 195 144 Z" fill="url(#leafGrad)"/>
  <!-- Left Sepal 2 -->
  <path d="M 196 145 Q 170 152 155 160 Q 175 158 196 148 Z" fill="url(#leafGrad)"/>
  <!-- Right Sepal 1 -->
  <path d="M 203 141 Q 225 130 238 135 Q 222 142 205 144 Z" fill="url(#leafGrad)"/>
  <!-- Right Sepal 2 -->
  <path d="M 204 145 Q 230 152 245 160 Q 225 158 204 148 Z" fill="url(#leafGrad)"/>

  <!-- Left Tomato Calyx Accent -->
  <path d="M 140 145 Q 130 135 125 140 Q 135 145 140 145 Z" fill="#2E7D32" opacity="0.8"/>
  <path d="M 140 145 Q 150 135 155 140 Q 145 145 140 145 Z" fill="#2E7D32" opacity="0.8"/>

  <!-- Right Tomato Calyx Accent -->
  <path d="M 260 145 Q 250 135 245 140 Q 255 145 260 145 Z" fill="#2E7D32" opacity="0.8"/>
  <path d="M 260 145 Q 270 135 275 140 Q 265 145 260 145 Z" fill="#2E7D32" opacity="0.8"/>
</svg>